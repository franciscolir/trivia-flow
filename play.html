<script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: {
            colors: { "tertiary-fixed": "#56ffa8", "secondary-container": "#ff24e4", "secondary": "#fface8", "on-tertiary-fixed": "#002110", "surface-container-highest": "#2f3639", "on-tertiary-fixed-variant": "#00522f", "surface-tint": "#47d6ff", "tertiary-fixed-dim": "#00e38b", "primary": "#a5e7ff", "surface": "#0e1417", "on-error": "#690005", "outline-variant": "#3c494e", "surface-container-low": "#161d1f", "on-primary": "#003543", "on-primary-fixed-variant": "#004e60", "surface-dim": "#0e1417", "surface-container-high": "#242b2e", "error-container": "#93000a", "inverse-surface": "#dde3e7", "primary-fixed": "#b6ebff", "background": "#0e1417", "error": "#ffb4ab", "on-secondary-fixed": "#3a0033", "on-primary-container": "#00566a", "outline": "#859399", "tertiary-container": "#00dd87", "tertiary": "#00fd9b", "on-primary-fixed": "#001f28", "on-tertiary": "#00391f", "on-tertiary-container": "#005b35", "on-surface": "#dde3e7", "surface-bright": "#333a3d", "on-surface-variant": "#bbc9cf", "on-background": "#dde3e7", "on-secondary": "#5e0053", "surface-container-lowest": "#090f12", "on-error-container": "#ffdad6", "inverse-primary": "#00677f", "on-secondary-container": "#520049", "primary-container": "#00d2ff", "secondary-fixed-dim": "#fface8", "inverse-on-surface": "#2b3134", "surface-container": "#1a2123", "primary-fixed-dim": "#47d6ff", "on-secondary-fixed-variant": "#840076", "secondary-fixed": "#ffd7f0", "surface-variant": "#2f3639" },

<style>
        body { background-color: #0B0E14; background-image: radial-gradient(circle at 0% 0%, rgba(165,231,255,0.15) 0%, transparent 50%), radial-gradient(circle at 100% 100%, rgba(255,172,232,0.15) 0%, transparent 50%); background-attachment: fixed; }
        .glass-panel { background: rgba(14,20,23,0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid transparent; background-clip: padding-box; position: relative; }
        .glass-panel::before { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: -1; margin: -1px; border-radius: inherit; background: linear-gradient(to bottom right, rgba(165,231,255,0.4), transparent); }
        .glow-active { box-shadow: 0 0 20px rgba(165,231,255,0.3); }
        @keyframes pulse-timer { 0% { text-shadow: 0 0 10px rgba(255,180,171,0.5); } 50% { text-shadow: 0 0 25px rgba(255,180,171,1), 0 0 40px rgba(255,180,171,0.8); } 100% { text-shadow: 0 0 10px rgba(255,180,171,0.5); } }
        .timer-pulse { animation: pulse-timer 1s infinite; color: #ffb4ab; }
        .answer-option { transition: all 0.25s ease; }
        .answer-option.correct { background: rgba(0,253,155,0.18); border-color: #00fd9b; }
        .answer-option.wrong { background: rgba(255,180,171,0.15); border-color: #ffb4ab; }
        .answer-option:disabled { cursor: default; }
        html.light .answer-option.correct { background: rgba(0,118,74,0.15); border-color: #00764a; }
        html.light .answer-option.wrong { background: rgba(186,26,26,0.12); border-color: #ba1a1a; }
    </style>
<link rel="stylesheet" href="css/arena.css"/>
</head>
<body class="text-on-background font-body-md antialiased min-h-screen flex flex-col overflow-hidden">
<header class="bg-surface/60 backdrop-blur-xl border-b border-primary/20 shadow-[0_0_20px_rgba(71,214,255,0.1)] flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20 w-full z-50 fixed top-0">
<a href="index" class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tighter">ULTRA ARENA</a>
<div class="flex items-center gap-4">
  <button id="theme-toggle" class="p-2 rounded-full border border-primary/30 text-primary hover:bg-surface-container/50 transition-all" title="Cambiar tema"><span class="material-symbols-outlined">light_mode</span></button>
  <div id="top-progress" class="text-primary font-bold border-b-2 border-primary pb-1 font-headline-md text-headline-md">TRIVIA</div>
</div>
</header>
<aside class="hidden md:flex bg-surface-container/80 backdrop-blur-2xl border-r border-secondary/20 shadow-2xl fixed left-0 top-0 h-full z-40 flex-col p-6 w-72 pt-28 overflow-y-auto">
<div class="mb-6">
<div class="font-headline-md text-headline-md text-secondary mb-2">CONTROL PANEL</div>
<div id="session-label" class="font-label-caps text-label-caps text-on-surface-variant">Live Session</div>
</div>
<div id="word-widget"></div>
<div id="tombola-slot"></div>
<div id="conductor-actions" class="flex flex-col gap-3 mt-6">
  <button id="show-answer" class="w-full py-3 rounded-lg border border-primary/40 text-primary font-label-caps text-label-caps hover:bg-primary/10 transition-colors">MOSTRAR RESPUESTA</button>
  <button id="guess-word" class="hidden w-full py-3 rounded-lg border border-secondary/40 text-secondary font-label-caps text-label-caps hover:bg-secondary/10 transition-colors">INTENTAR RESOLVER PALABRA</button>
  <button id="finish-tournament" class="w-full py-3 rounded-lg border border-error/50 text-error font-label-caps text-label-caps hover:bg-error/10 transition-colors">FINALIZAR TORNEO</button>
</div>
</aside>
<main class="flex-1 pt-24 pb-40 md:pl-72 md:pr-margin-desktop px-margin-mobile flex flex-col relative overflow-y-auto">
<div id="wordbar" class="mb-6"></div>
<div id="loading" class="flex-1 flex flex-col items-center justify-center gap-4 text-center">
  <div class="w-12 h-12 rounded-full border-4 border-primary/20 border-t-primary animate-spin"></div>
  <p class="font-label-caps text-label-caps text-on-surface-variant">CARGANDO PREGUNTAS...</p>
</div>
<div id="no-data" class="hidden flex-1 flex flex-col items-center justify-center gap-4 text-center">
  <span class="material-symbols-outlined text-6xl text-outline-variant">help_center</span>
  <p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">No hay trivias publicadas todavía. Agrega preguntas a Firestore (colección <code class="text-primary">trivias</code>).</p>
  <a href="index" class="btn-primary rounded-xl px-8 py-3 font-label-caps text-label-caps">VOLVER</a>
</div>
<div id="game" class="hidden flex-1 flex flex-col">
<div class="w-full flex justify-center mb-6 relative z-10">
<div class="glass-panel rounded-full px-8 py-2 border border-error/50 shadow-[0_0_20px_rgba(255,180,171,0.2)]">
<span class="font-label-caps text-label-caps text-on-surface-variant mr-4 uppercase"><span id="timer-label">TIEMPO</span></span>
<span id="timer" class="font-display-lg-mobile text-display-lg-mobile timer-pulse">00:15</span>
</div>
</div>
<div class="glass-panel rounded-2xl p-8 md:p-10 mb-6 text-center max-w-4xl mx-auto w-full glow-active border-primary/50 relative overflow-hidden">
<div class="absolute inset-0 opacity-20 pointer-events-none bg-gradient-to-br from-primary/10 to-secondary/10"></div>
<h2 id="game-label" class="font-label-caps text-label-caps text-primary mb-3 tracking-widest">TRIVIA</h2>
<h1 id="question-text" class="font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface mb-10 drop-shadow-lg relative z-10">¿Pregunta?</h1>
<div id="answers" class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5 relative z-10"></div>
</div>
<div id="award-row" class="hidden flex flex-col items-center gap-3 mb-6">
  <p class="font-label-caps text-label-caps text-on-surface-variant">EQUIPO QUE ACERTÓ</p>
  <div id="award-buttons" class="flex flex-wrap justify-center gap-3"></div>
</div>
<div class="flex flex-wrap justify-center gap-4">
<button id="next-game" class="hidden btn-primary rounded-xl px-10 py-4 font-label-caps text-label-caps uppercase tracking-wider">SIGUIENTE</button>
<button id="restart" class="hidden px-8 py-4 rounded-xl border border-outline-variant text-on-surface font-label-caps transition-colors hover:bg-surface-bright">REINICIAR</button>
<a id="go-home" class="hidden px-8 py-4 rounded-xl border border-outline-variant text-on-surface font-label-caps transition-colors hover:bg-surface-bright" href="index">INICIO</a>
</div>
</div>
</main>
<footer class="bg-surface-container-highest/90 backdrop-blur-md border-t border-primary/30 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] fixed bottom-0 left-0 w-full z-50 rounded-t-xl">
<div id="scoreboard" class="flex justify-around items-center h-24 px-4 overflow-x-auto"></div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firestore.js"></script>
<script src="js/sounds.js"></script>
<script src="js/arena.js"></script>
<script src="js/session.js"></script>
<script src="js/components.js"></script>
<script>
  // ---------------- Sesión ----------------
  initSessionFromUrlOrLocal();
  const gi = getGameIndexFromUrl();
  const sess = getSession();
  if (sess.games && sess.games.length) sess.currentGameIndex = gi;
  const cfg = getCurrentGame();
  const isCircuit = !!(sess && sess.mode === 'circuit' && sess.games && sess.games.length);
  const isTimed = !!(new URLSearchParams(location.search).get('mode') === 'timed' || (cfg && cfg.type === 'timed'));

  const state = {
    questions: [], index: 0, correct: 0, answered: false,
    perQuestionTime: (cfg && cfg.settings && cfg.settings.timePerQuestion) || (cfg && cfg.type !== 'timed' ? 15 : 0),
    totalTime: (cfg && cfg.settings && cfg.settings.totalTime) || 60,
    maxQuestions: (cfg && cfg.settings && cfg.settings.maxQuestions) || 20,
    pointsPerQuestion: (cfg && cfg.points) || 100,
    totalTimer: null, questionTimer: null, timeLeft: 0
  };

  const $q = {
    loading: $('#loading'), noData: $('#no-data'), game: $('#game'),
    timer: $('#timer'), timerLabel: $('#timer-label'), question: $('#question-text'), answers: $('#answers'),
    gameLabel: $('#game-label'), awardRow: $('#award-row'), awardButtons: $('#award-buttons'),
    nextBtn: $('#next-game'), restart: $('#restart'), goHome: $('#go-home'),
    sessionLabel: $('#session-label'), topProgress: $('#top-progress'), showAnswer: $('#show-answer'), guessWord: $('#guess-word')
  };
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

  function fmtTime(s) { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function renderTimer() {
    $q.timer.textContent = fmtTime(state.timeLeft);
    $q.timer.classList.toggle('timer-pulse', state.timeLeft <= 10);
  }

  function startQuestionTimer() {
    stopQuestionTimer();
    if (!state.perQuestionTime && !isTimed) { $q.timer.textContent = '∞'; return; }
    if (isTimed) { state.timeLeft = state.totalTime; $q.timerLabel.textContent = 'TIEMPO TOTAL'; startTotalTimer(); return; }
    state.timeLeft = state.perQuestionTime;
    $q.timerLabel.textContent = 'TIEMPO';
    renderTimer();
    state.questionTimer = setInterval(() => { state.timeLeft--; playTick(); renderTimer(); if (state.timeLeft <= 0) { stopQuestionTimer(); reveal(null); } }, 1000);
  }
  function startTotalTimer() {
    stopQuestionTimer();
    renderTimer();
    state.totalTimer = setInterval(() => { state.timeLeft--; playTick(); renderTimer(); if (state.timeLeft <= 0) { stopQuestionTimer(); endGame(); } }, 1000);
  }
  function stopQuestionTimer() { if (state.questionTimer) { clearInterval(state.questionTimer); state.questionTimer = null; } if (state.totalTimer) { clearInterval(state.totalTimer); state.totalTimer = null; } }

  // ---------------- Preguntas ----------------
  async function loadQuestions() {
    let trivias = [];
    try { trivias = await getTrivias(); } catch (e) { console.error(e); }
    const all = trivias.flatMap(t => (t.questions || []).map(q => ({ ...q })));
    if (!all.length) { $q.loading.classList.add('hidden'); $q.noData.classList.remove('hidden'); return; }
    const target = state.maxQuestions || 10;
    state.questions = shuffleArray(all).slice(0, Math.min(target, all.length));
    state.index = 0; state.correct = 0;
    $q.loading.classList.add('hidden');
    $q.game.classList.remove('hidden');
    renderQuestion();
  }

  function renderQuestion() {
    const q = state.questions[state.index];
    $q.gameLabel.textContent = (cfg ? cfg.name : (isTimed ? 'TRIVIA CONTRARRELOJ' : 'TRIVIA')).toUpperCase();
    $q.question.textContent = q.text;
    const correctIndex = q.options.findIndex(o => o.correct);
    $q.answers.innerHTML = q.options.map((opt, i) => `
      <button data-i="${i}" class="answer-option bg-surface-container-high hover:bg-primary-container hover:text-on-primary-container rounded-xl p-6 border border-outline-variant hover:border-primary text-left flex items-center group relative overflow-hidden">
        <span class="font-label-caps text-label-caps text-primary mr-4 group-hover:text-on-primary-container">${letters[i]}</span>
        <span class="font-headline-md text-headline-md">${escapeHtml(opt.text)}</span>
      </button>`).join('');
    $$('.answer-option', $q.answers).forEach(btn => btn.addEventListener('click', () => select(+btn.dataset.i)));
    state.answered = false;
    state.correctIndex = correctIndex;
    $q.awardRow.classList.add('hidden');
    $q.nextBtn.classList.add('hidden');
    $q.restart.classList.add('hidden');
    $q.goHome.classList.add('hidden');
    startQuestionTimer();
  }

  function select(i) {
    if (state.answered) return;
    state.answered = true;
    stopQuestionTimer();
    const ok = i === state.correctIndex;
    if (ok) { state.correct++; playCorrect(); } else playWrong();
    $$('.answer-option', $q.answers).forEach(btn => {
      btn.disabled = true;
      const idx = +btn.dataset.i;
      if (idx === state.correctIndex) btn.classList.add('correct');
      else if (idx === i) btn.classList.add('wrong');
    });
    if (ok && isCircuit) $q.awardRow.classList.remove('hidden');
    setTimeout(finishQuestion, isCircuit ? 2000 : 1200);
  }

  function reveal(_) {
    if (state.answered) return;
    state.answered = true;
    stopQuestionTimer();
    playWrong();
    $$('.answer-option', $q.answers).forEach(btn => { btn.disabled = true; if (+btn.dataset.i === state.correctIndex) btn.classList.add('correct'); });
    setTimeout(finishQuestion, 1400);
  }

  function finishQuestion() {
    if (isTimed && state.index + 1 >= state.maxQuestions) { endGame(); return; }
    state.index++;
    if (state.index >= state.questions.length) endGame();
    else renderQuestion();
  }

  function endGame() {
    stopQuestionTimer();
    playFinish();
    if (isCircuit) {
      const winner = getRanking()[0];
      logEvent('GAME_FINISHED', { gameId: cfg ? cfg.id : null, winnerTeamId: winner ? winner.id : null });
      const afterWord = () => showGameResult({
        title: 'FIN DE JUEGO', subtitle: winner ? winner.name : 'Sin puntos',
        rankings: getRanking(), nextLabel: 'SIGUIENTE JUEGO →',
        onNext: () => window.location.href = nextGameUrl(), onHome: () => window.location.href = 'index'
      });
      if (sess.word && sess.word.active && !isWordComplete()) {
        openCellPicker({ winnerTeam: winner, onDone: afterWord });
      } else afterWord();
    } else {
      $q.gameLabel.textContent = 'RESULTADO';
      $q.question.textContent = 'Aciertos: ' + state.correct + ' / ' + state.questions.length;
      $q.answers.innerHTML = '<p class="col-span-2 font-body-lg text-body-lg text-on-surface-variant text-center py-8">' + (state.correct * state.pointsPerQuestion) + ' puntos</p>';
      $q.restart.classList.remove('hidden');
      $q.goHome.classList.remove('hidden');
    }
  }

  // ---------------- Botones del conductor ----------------
  $q.showAnswer.addEventListener('click', () => { if (!state.answered) reveal(null); });
  $q.nextBtn.addEventListener('click', () => window.location.href = nextGameUrl());
  $q.restart.addEventListener('click', () => { state.index = 0; state.correct = 0; state.questions = shuffleArray(state.questions); renderQuestion(); });

  // Asignación de puntos por equipo
  if (isCircuit && sess.teams) {
    $q.awardButtons.innerHTML = sess.teams.map(t => {
      const color = COLORS[t.color] || COLORS.rojo;
      return `<button data-award="${t.id}" class="px-6 py-3 rounded-xl border border-outline-variant font-label-caps text-label-caps hover:border-primary transition-colors ${color.text}">${escapeHtml(t.name)}</button>`;
    }).join('');
  }
  $$('#award-buttons [data-award]').forEach(b => b.addEventListener('click', () => {
    addScore(b.dataset.award, state.pointsPerQuestion, 'Acierto de trivia', cfg ? cfg.id : null);
    playCorrect();
    $q.awardRow.classList.add('hidden');
  }));

  // Intento de resolver la palabra
  if (sess.word && sess.word.active && sess.word.guessEnabled) {
    $q.guessWord.classList.remove('hidden');
    $q.guessWord.addEventListener('click', () => {
      const attempt = prompt('¿Cuál es la palabra?');
      if (!attempt) return;
      const ok = guessWord(null, attempt);
      if (ok) { updateWordBar(); showWordCompleted(); }
      else alert('Palabra incorrecta' + (sess.word.guessPenalty ? ' (-' + sess.word.guessPenalty + ' al equipo que intente)' : ''));
    });
  }

  $('#finish-tournament').addEventListener('click', () => { clearSession(); resetSessionScores(); window.location.href = 'index'; });

  // ---------------- Cabeceras y dinámicas ----------------
  $q.sessionLabel.textContent = sess ? (sess.name || 'Live Session') : 'Live Session';
  if (isCircuit) $q.topProgress.textContent = 'JUEGO ' + (gi + 1) + ' / ' + sess.games.length;
  else $q.topProgress.textContent = isTimed ? 'CONTRARRELOJ' : 'JUGAR INDIVIDUAL';

  if (sess && sess.word && sess.word.active) mountWordBar('#wordbar');
  if (sess && sess.tombola && sess.tombola.active) {
    renderTombola($('#tombola-slot'), { session: sess });
  } else {
    $('#tombola-slot').innerHTML = '<a href="tombola?gi=' + gi + '" class="block glass-panel rounded-xl p-4 border border-outline-variant text-on-surface-variant font-label-caps text-label-caps hover:bg-surface-bright transition-all">🎲 ABRIR TÓMBOLA</a>';
  }
  if (sess && sess.word && sess.word.active) {
    const w = $('#word-widget');
    w.innerHTML = '<a href="word?gi=' + gi + '" class="block glass-panel rounded-xl p-4 border border-outline-variant text-on-surface-variant font-label-caps text-label-caps hover:bg-surface-bright transition-all">🔤 VER GRILLA DE PALABRA</a>';
  }

  renderScoreboardTeams('#scoreboard');
  loadQuestions();
</script>
</body></html>
