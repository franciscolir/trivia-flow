<style>
        body { background-color: #0B0E14; background-image: radial-gradient(circle at 0% 0%, rgba(165,231,255,0.15) 0%, transparent 50%), radial-gradient(circle at 100% 100%, rgba(255,172,232,0.15) 0%, transparent 50%); background-attachment: fixed; }

        .memory-card { perspective: 800px; cursor: pointer; }

        .memory-card.flipped .memory-inner { transform: rotateY(180deg); }
        .memory-face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 0.75rem; }

<link rel="stylesheet" href="css/arena.css"/>
</head>
<body class="text-on-background font-body-md antialiased min-h-screen flex flex-col overflow-hidden">
<header class="bg-surface/60 backdrop-blur-xl border-b border-primary/20 shadow-[0_0_20px_rgba(71,214,255,0.1)] flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20 w-full z-50 fixed top-0">
<a href="index" class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tighter">ULTRA ARENA</a>
<div class="flex items-center gap-4">
  <button id="theme-toggle" class="p-2 rounded-full border border-primary/30 text-primary hover:bg-surface-container/50 transition-all" title="Cambiar tema"><span class="material-symbols-outlined">light_mode</span></button>
  <div id="top-progress" class="text-primary font-bold border-b-2 border-primary pb-1 font-headline-md text-headline-md">MEMORICE</div>
</div>
</header>
<main class="flex-1 pt-24 pb-40 md:px-margin-desktop px-margin-mobile flex flex-col items-center relative overflow-y-auto">
<div id="wordbar" class="mb-6 w-full max-w-4xl"></div>
<div class="w-full flex justify-center mb-6 relative z-10">
<div class="glass-panel rounded-full px-8 py-2 border border-error/50 shadow-[0_0_20px_rgba(255,180,171,0.2)]">
<span class="font-label-caps text-label-caps text-on-surface-variant mr-4 uppercase">Tiempo</span>
<span id="timer" class="font-display-lg-mobile text-display-lg-mobile timer-pulse">00:00</span>
</div>
</div>
<div class="flex items-center justify-center gap-8 mb-6">
  <div class="text-center"><div class="font-label-caps text-label-caps text-on-surface-variant">PAREJAS</div><div id="pairs" class="font-headline-md text-headline-md text-primary">0 / 8</div></div>
  <div class="text-center"><div class="font-label-caps text-label-caps text-on-surface-variant">INTENTOS</div><div id="moves" class="font-headline-md text-headline-md text-secondary">0</div></div>
  <div class="text-center"><div class="font-label-caps text-label-caps text-on-surface-variant">EQUIPO QUE JUEGA</div><div id="playing-team" class="font-headline-md text-headline-md text-tertiary">—</div></div>
</div>
<h2 id="game-label" class="font-label-caps text-label-caps text-primary mb-6 tracking-widest">MEMORICE</h2>
<div id="board" class="grid grid-cols-4 gap-3 md:gap-4 w-full max-w-2xl"></div>
<div id="tombola-slot" class="w-full max-w-md mt-8"></div>
<div class="flex flex-wrap justify-center gap-4 mt-10">
<button id="next-game" class="hidden btn-primary rounded-xl px-10 py-4 font-label-caps text-label-caps uppercase tracking-wider">SIGUIENTE</button>
<button id="restart" class="px-8 py-4 rounded-xl border border-outline-variant text-on-surface font-label-caps transition-colors hover:bg-surface-bright">REINICIAR</button>
<a id="go-home" class="hidden px-8 py-4 rounded-xl border border-outline-variant text-on-surface font-label-caps transition-colors hover:bg-surface-bright" href="index">INICIO</a>
</div>
</main>
<footer class="bg-surface-container-highest/90 backdrop-blur-md border-t border-primary/30 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] fixed bottom-0 left-0 w-full z-50 rounded-t-xl">
<div id="scoreboard" class="flex justify-around items-center h-24 px-4 overflow-x-auto"></div>
</footer>

<script src="js/sounds.js"></script>
<script src="js/arena.js"></script>
<script src="js/turn.js"></script>
<script src="js/timer.js"></script>
<script src="js/game.js"></script>
<script src="js/registry.js"></script>
<script src="js/session.js"></script>
<script src="js/components.js"></script>
<script>
  const EMOJIS = ['🚀', '🌟', '🎯', '🎲', '🦁', '🍕', '⚡', '🎵', '🌙', '🎸', '🐉', '🏆'];
  initSessionFromUrlOrLocal();
  const gi = getGameIndexFromUrl();
  const sess = getSession();
  if (sess.games && sess.games.length) sess.currentGameIndex = gi;
  const cfg = getCurrentGame();
  const isCircuit = !!(sess && sess.mode === 'circuit' && sess.games && sess.games.length);
  const pairsCount = (cfg && cfg.settings && cfg.settings.pairs) || 8;

  const $b = {
    board: $('#board'), timer: $('#timer'), pairs: $('#pairs'), moves: $('#moves'),
    nextBtn: $('#next-game'), restart: $('#restart'), goHome: $('#go-home'), gameLabel: $('#game-label'),
    topProgress: $('#top-progress'), playingTeam: $('#playing-team')
  };

  let cards = [], flipped = [], matched = 0, moves = 0, lock = false, timeLeft = 0;
  const memTimer = new TimerManager();
  const turns = new TurnManager().setTeams(isCircuit && sess.teams ? sess.teams.slice() : []);
  const ptsPerPair = (cfg && cfg.points) || 15;

  function fmtTime(s) { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function buildCards() {
    const emojis = EMOJIS.slice(0, pairsCount);
    cards = shuffleArray([...emojis, ...emojis].map((emoji, i) => ({ id: i, pairId: emoji, emoji, state: 'hidden' })));
  }
  function render() {
    $b.board.innerHTML = cards.map((c, i) => `
      <button data-i="${i}" class="memory-card ${c.state === 'revealed' ? 'flipped' : ''} ${c.state === 'matched' ? 'flipped matched' : ''}" ${c.state === 'matched' ? 'disabled' : ''}>
        <div class="memory-inner">
          <div class="memory-face memory-back"><span class="material-symbols-outlined text-3xl text-primary">question_mark</span></div>
          <div class="memory-face memory-front"><span class="text-4xl">${c.state === 'matched' || c.state === 'revealed' ? c.emoji : ''}</span></div>
        </div>
      </button>`).join('');
    $$('.memory-card', $b.board).forEach(btn => btn.addEventListener('click', () => flip(+btn.dataset.i)));
  }
  function updateTurn() {
    const t = turns.current();
    $b.playingTeam.textContent = isCircuit && t ? ('TURNO: ' + t.name) : '—';
    $b.playingTeam.classList.toggle('text-tertiary', !!t);
  }
  function flip(i) {
    if (lock) return;
    const c = cards[i];
    if (c.state !== 'hidden' || flipped.includes(i)) return;
    c.state = 'revealed';
    flipped.push(i);
    render();
    if (flipped.length === 2) {
      lock = true;
      moves++;
      $b.moves.textContent = moves;
      const [a, b] = flipped;
      if (cards[a].pairId === cards[b].pairId) {
        cards[a].state = cards[b].state = 'matched';
        matched++;
        $b.pairs.textContent = matched + ' / ' + pairsCount;
        playCorrect();
        // Quien acierta la pareja continúa; suma puntos si es circuito
        if (isCircuit) { const t = turns.current(); if (t) addScore(t.id, ptsPerPair, 'Pareja de Memorice', cfg ? cfg.id : null); }
        flipped = []; lock = false;
        render();
        if (matched === pairsCount) finish();
      } else {
        playWrong();
        // Si falla: ocultar temporales y pasar turno
        setTimeout(() => {
          cards[a].state = cards[b].state = 'hidden';
          flipped = []; lock = false;
          render();
          if (isCircuit) turns.next();
          updateTurn();
        }, 900);
      }
    }
  }
  function startTimer() {
    memTimer.stop();
    const total = (cfg && cfg.duration) ? cfg.duration * 60 : 180;
    timeLeft = total;
    $b.timer.textContent = fmtTime(timeLeft);
    memTimer.start(total,
      (sec) => { timeLeft = sec; playTick(); $b.timer.textContent = fmtTime(timeLeft); },
      () => { finish(); });
  }
  function finish() {
    memTimer.stop();
    playFinish();
    if (isCircuit) {
      const winner = getRanking()[0];
      const result = buildResult({
        gameId: cfg ? cfg.id : null,
        winnerTeamId: winner ? winner.id : null,
        rankings: getRanking(),
        pointsAwarded: { winner: winner ? winner.score : 0 },
        statistics: { pairs: pairsCount, moves }
      });
      sess.lastResult = result;
      logEvent('GAME_FINISHED', { gameId: cfg ? cfg.id : null, winnerTeamId: winner ? winner.id : null, result });
      persistSession();
      logEvent('GAME_FINISHED', { gameId: cfg ? cfg.id : null, winnerTeamId: winner ? winner.id : null });
      const afterWord = () => showGameResult({
        title: 'FIN DE JUEGO', subtitle: winner ? winner.name : 'Sin puntos',
        rankings: getRanking(), nextLabel: 'SIGUIENTE JUEGO →',
        onNext: () => window.location.href = nextGameUrl(), onHome: () => window.location.href = 'index'
      });
      if (sess.word && sess.word.active && !isWordComplete()) openCellPicker({ winnerTeam: winner, onDone: afterWord });
      else afterWord();
    } else {
      $b.gameLabel.textContent = '¡COMPLETADO!';
      $b.goHome.classList.remove('hidden');
    }
  }
  function reset() {
    matched = 0; moves = 0; flipped = []; lock = false;
    buildCards();
    $b.pairs.textContent = '0 / ' + pairsCount;
    $b.moves.textContent = '0';
    $b.nextBtn.classList.add('hidden');
    $b.goHome.classList.add('hidden');
    render();
    startTimer();
  }

  if (isCircuit) $b.topProgress.textContent = 'JUEGO ' + (gi + 1) + ' / ' + sess.games.length;
  else $b.topProgress.textContent = 'JUGAR INDIVIDUAL';
  $b.gameLabel.textContent = (cfg ? cfg.name : 'MEMORICE').toUpperCase();

  if (sess && sess.word && sess.word.active) mountWordBar('#wordbar');
  if (sess && sess.tombola && sess.tombola.active) renderTombola($('#tombola-slot'), { session: sess });

  $b.nextBtn.addEventListener('click', () => window.location.href = nextGameUrl());
  $b.restart.addEventListener('click', () => { turns.reset(); updateTurn(); reset(); });
  renderScoreboardTeams('#scoreboard');
  updateTurn();
  reset();
</script>
</body></html>
