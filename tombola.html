<style>
        .tombola-gradient { background: radial-gradient(circle at center, rgba(71, 214, 255, 0.15) 0%, rgba(11, 14, 20, 1) 70%); }
        .slot-machine-view { perspective: 1000px; overflow: hidden; position: relative; }
        .slot-machine-view::before, .slot-machine-view::after { content: ''; position: absolute; left: 0; right: 0; height: 150px; z-index: 10; pointer-events: none; }
        .slot-machine-view::before { top: 0; background: linear-gradient(to bottom, rgba(14, 20, 23, 1) 0%, rgba(14, 20, 23, 0) 100%); }
        .slot-machine-view::after { bottom: 0; background: linear-gradient(to top, rgba(14, 20, 23, 1) 0%, rgba(14, 20, 23, 0) 100%); }
        .slot-content { display: flex; flex-direction: column; align-items: center; transition: transform 3s cubic-bezier(0.1, 0.7, 0.1, 1); }
        .slot-content.no-anim { transition: none; }
        .name-item { height: 80px; display: flex; align-items: center; justify-content: center; opacity: 0.3; transition: opacity 0.3s, transform 0.3s, color 0.3s; transform: scale(0.8); }
        .name-item.active { opacity: 1; transform: scale(1.2); color: #a5e7ff; text-shadow: 0 0 20px rgba(71, 214, 255, 0.5); }
        .glow-border { position: relative; }
        .glow-border::after { content: ''; position: absolute; inset: -2px; background: linear-gradient(90deg, transparent, #a5e7ff, transparent); z-index: -1; filter: blur(10px); opacity: 0.5; border-radius: inherit; }
        .particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background-image: radial-gradient(circle, #a5e7ff 1px, transparent 1px), radial-gradient(circle, #fface8 1px, transparent 1px); background-size: 50px 50px, 100px 100px; background-position: 0 0, 25px 25px; opacity: 0.1; animation: particlesMove 20s linear infinite; }
        @keyframes particlesMove { 0% { background-position: 0 0, 25px 25px; } 100% { background-position: 500px 500px, 525px 525px; } }
        .glass-panel { background: rgba(14, 20, 23, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(71, 214, 255, 0.1); }
        .glass-button-primary { background: linear-gradient(135deg, rgba(0, 210, 255, 0.8) 0%, rgba(71, 214, 255, 0.4) 100%); border: 1px solid rgba(165, 231, 255, 0.5); transition: all 0.3s ease; }
        .glass-button-primary:hover { box-shadow: 0 0 20px rgba(0, 210, 255, 0.4); transform: scale(1.05); }
        .glass-button-secondary { background: transparent; border: 1px solid #ff24e4; color: #fface8; transition: all 0.3s ease; }
        .glass-button-secondary:hover { background: rgba(255, 36, 228, 0.1); box-shadow: 0 0 15px rgba(255, 36, 228, 0.2); }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden tombola-gradient">
<div class="particles"></div>
<!-- TopAppBar -->
<header class="bg-surface/60 backdrop-blur-xl border-b border-primary/20 shadow-[0_0_20px_rgba(71,214,255,0.1)] flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20 w-full z-50 fixed top-0">
<div class="flex items-center gap-4">
<a href="index.html" class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tighter">ULTRA ARENA</a>
</div>
<div class="flex items-center gap-4">
  <button id="back-btn" onclick="mirrorGo('index')" class="p-2 rounded-full border border-outline-variant/60 text-on-surface-variant hover:bg-surface-container/50 hover:text-primary transition-all" title="Volver al inicio"><span class="material-symbols-outlined">arrow_back</span></button>
  <button id="mute-toggle" class="p-2 rounded-full border border-primary/30 text-primary hover:bg-surface-container/50 transition-all" title="Silenciar sonido"><span class="material-symbols-outlined">volume_up</span></button>
<button id="theme-toggle" class="p-2 rounded-full border border-primary/30 text-primary hover:bg-surface-container/50 transition-all" title="Cambiar tema">
    <span class="material-symbols-outlined">light_mode</span>
  </button>
  <span id="top-progress" class="hidden font-label-caps text-label-caps text-primary">JUEGO 3 / 5</span>
</div>
</header>
<div class="flex-1 flex pt-20 h-screen w-full">
<main class="has-scorebar flex-1 flex flex-col relative p-margin-mobile md:p-6 gap-gutter h-full pb-32 md:pb-6 overflow-y-auto">
<div class="flex-1 flex flex-col lg:flex-row gap-gutter h-full">
<!-- Drum -->
<section class="flex-1 flex flex-col justify-center items-center glass-panel rounded-2xl p-8 relative overflow-hidden">
<div class="absolute inset-0 bg-primary/5 opacity-50 z-0"></div>
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tighter mb-6 z-10 text-center drop-shadow-[0_0_15px_rgba(165,231,255,0.5)]">SELECCIÓN AL AZAR</h1>
<div class="w-full max-w-2xl h-[320px] border-y border-primary/30 relative z-10 flex items-center justify-center bg-surface-container-lowest/80 shadow-[inset_0_0_50px_rgba(0,0,0,0.8)] slot-machine-view rounded-xl glow-border">
<div class="absolute top-1/2 left-0 w-full h-[80px] -translate-y-1/2 border-y-2 border-primary bg-primary/10 z-20 pointer-events-none shadow-[0_0_30px_rgba(71,214,255,0.2)]"></div>
<div class="slot-content no-anim w-full absolute top-1/2 -translate-y-1/2" id="drum-content"></div>
</div>
<div data-conductor class="mt-12 flex flex-wrap justify-center gap-6 z-10">
<button id="spin-btn" class="glass-button-primary font-display-lg-mobile px-12 py-4 rounded-xl text-on-primary font-black tracking-widest shadow-[0_0_30px_rgba(0,210,255,0.3)]">GIRAR</button>
<div class="flex gap-4">
<button id="reset-btn" class="px-6 py-3 rounded-xl border border-outline-variant hover:bg-surface-bright text-on-surface font-label-caps transition-colors">
<span class="material-symbols-outlined align-middle mr-2">restart_alt</span>REINICIAR</button>
<button id="exclude-btn" class="px-6 py-3 rounded-xl border border-error/50 text-error hover:bg-error/10 font-label-caps transition-colors">
<span class="material-symbols-outlined align-middle mr-2">person_remove</span>EXCLUIR</button>
</div>
</div>
<button id="next-game" data-conductor class="hidden glass-button-primary font-label-caps text-label-caps px-10 py-4 rounded-xl mt-8">SIGUIENTE JUEGO →</button>
<button data-conductor onclick="openPublicScreen()" class="glass-button-secondary font-label-caps text-label-caps px-10 py-4 rounded-xl mt-8">
<span class="material-symbols-outlined align-middle mr-2 text-[18px]">tv</span>PANTALLA PÚBLICA</button>
</section>
<!-- Sidebar -->
<aside data-conductor class="w-full lg:w-80 flex flex-col gap-6 h-full overflow-y-auto">
<div class="glass-panel rounded-xl p-6 flex-1 flex flex-col">
<div class="flex items-center justify-between mb-4 border-b border-outline-variant pb-2">
<h3 class="font-label-caps text-on-surface">PARTICIPANTES</h3>
<span id="pool-count" class="text-primary font-bold">0</span>
</div>
<div id="participants" class="flex-1 overflow-y-auto pr-2 space-y-2"></div>
</div>
<div class="glass-panel rounded-xl p-6 h-64 flex flex-col">
<div class="flex items-center justify-between mb-4 border-b border-outline-variant pb-2">
<h3 class="font-label-caps text-secondary">HISTORIAL</h3>
<span class="material-symbols-outlined text-secondary text-sm">history</span>
</div>
<div id="history" class="flex-1 overflow-y-auto pr-2 space-y-3"></div>
</div>
</aside>
</div>
</main>
</div>
<!-— Marcador lateral derecho -->
<aside id="scorebar" class="fixed z-40 flex flex-col right-0 top-20 bottom-0 w-48 sm:w-56 md:w-64 border-l border-primary/30 bg-surface-container-highest/85 backdrop-blur-md shadow-[-10px_0_30px_rgba(0,0,0,0.5)] max-md:top-auto max-md:left-0 max-md:right-0 max-md:bottom-0 max-md:w-full max-md:h-24 max-md:flex-row max-md:border-l-0 max-md:border-t max-md:rounded-t-xl max-md:shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
<div class="shrink-0 px-4 py-2.5 border-b border-primary/20 font-label-caps text-label-caps text-secondary uppercase tracking-wider max-md:hidden">MARCADOR</div>
<div id="circuit-progress" class="hidden border-b border-primary/20"></div>
<div id="scoreboard" class="flex flex-1 flex-col overflow-y-auto max-md:flex-row max-md:overflow-x-auto max-md:overflow-y-hidden"></div>
</aside>

<script src="js/sounds.js"></script>
<script src="js/arena.js"></script>
<script src="js/turn.js"></script>
<script src="js/timer.js"></script>
<script src="js/game.js"></script>
<script src="js/registry.js"></script>
<script src="js/session.js"></script>
<script src="js/components.js"></script>
<script>
  if (!isPublic()) {
  initSessionFromUrlOrLocal();
  const gi = getGameIndexFromUrl();
  const sess = getSession();
  if (sess.games && sess.games.length) sess.currentGameIndex = gi;
  const isCircuit = !!(sess && sess.mode === 'circuit' && sess.games && sess.games.length);

  const DEFAULT_NAMES = ['Alex Rivera', 'María Gómez', 'Carlos Chen', 'Sara Connor', 'David Smith', 'Elena Ruiz'];
  const sourcePool = (sess && sess.tombola && sess.tombola.pool && sess.tombola.pool.length)
    ? sess.tombola.pool.slice()
    : (sess && sess.participants && sess.participants.length ? sess.participants.map(p => p.name) : DEFAULT_NAMES);
  let pool = [...sourcePool];
  let history = [];
  let spinning = false;
  let lastPick = null;

  const $t = {
    drum: $('#drum-content'), participants: $('#participants'), history: $('#history'),
    poolCount: $('#pool-count'), spin: $('#spin-btn'), exclude: $('#exclude-btn'),
    reset: $('#reset-btn'), next: $('#next-game'), topProgress: $('#top-progress')
  };

  function renderParticipants() {
    $t.poolCount.textContent = pool.length;
    $t.participants.innerHTML = pool.map((n, i) => `
      <div class="flex items-center justify-between p-2 rounded bg-surface-container hover:bg-surface-bright cursor-pointer">
        <span class="font-body-md text-on-surface-variant">${String(i + 1).padStart(3, '0')} - ${escapeHtml(n)}</span>
        <div class="w-2 h-2 rounded-full bg-tertiary"></div>
      </div>`).join('');
  }

  function renderHistory() {
    $t.history.innerHTML = history.map((n, i) => `
      <div class="flex items-center gap-3 text-sm">
        <span class="text-on-surface-variant opacity-50 font-label-caps">#${history.length - i}</span>
        <span class="${i === 0 ? 'text-primary font-bold' : 'text-on-surface-variant'}">${escapeHtml(n)}</span>
      </div>`).join('');
  }

  const ITEM_H = 80;
  let rolling = null, rollPos = 0, drumItems = [];

  function renderDrum() {
    // Lista larga (8 ciclos) para un giro continuo y sin saltos
    const cycle = pool.length ? pool : [''];
    const items = [];
    for (let c = 0; c < 8; c++) cycle.forEach((n) => items.push({ name: n }));
    drumItems = items;
    $t.drum.innerHTML = items.map(x => `<div class="name-item font-display-lg text-4xl font-bold tracking-wider">${escapeHtml(x.name)}</div>`).join('');
    return items;
  }

  function toggleSpin() {
    if (!spinning) {
      // PRIMER clic: comenzar a girar
      if (pool.length === 0) return;
      spinning = true;
      $t.spin.textContent = 'PARAR';
      renderDrum();
      rollPos = 0;
      $t.drum.classList.add('no-anim');
      rolling = setInterval(() => {
        rollPos++;
        if (rollPos >= drumItems.length - 8) { renderDrum(); rollPos = 8; }
        $t.drum.style.transform = `translateY(${-rollPos * ITEM_H}px)`;
      }, 70);
      return;
    }
    // SEGUNDO clic: decelerar y detenerse
    if (rolling) clearInterval(rolling);
    rolling = null;
    spinning = false;
    $t.spin.textContent = 'GIRAR';
    $t.spin.disabled = true;
    const target = pool[Math.floor(Math.random() * pool.length)];
    const occ = drumItems.map((x, i) => ({ x, i })).filter(o => o.x.name === target);
    const candidates = occ.filter(o => o.i >= rollPos + 2);
    const pick = (candidates.length ? candidates : occ)[0].i;
    $t.drum.classList.remove('no-anim');
    // Centra exactamente el ítem elegido entre las dos líneas centrales
    $t.drum.style.transform = `translateY(${-pick * ITEM_H - ITEM_H / 2}px)`;
    setTimeout(() => {
      $t.drum.querySelectorAll('.name-item').forEach(el => el.classList.remove('active'));
      const itemsEls = $t.drum.querySelectorAll('.name-item');
      const activeEl = itemsEls[Math.min(pick, itemsEls.length - 1)];
      if (activeEl) activeEl.classList.add('active');
      lastPick = target;
      pool = pool.filter(n => n !== target);
      history.unshift(target);
      renderParticipants();
      renderHistory();
      playFinish();
      $t.spin.disabled = false;
      if (pool.length === 0) { $t.exclude.disabled = true; }
    }, 3100);
  }

  $t.spin.addEventListener('click', toggleSpin);
  $t.exclude.addEventListener('click', () => {
    if (!lastPick) return;
    history.unshift(lastPick + ' (excluido)');
    renderHistory();
  });
  $t.reset.addEventListener('click', () => {
    if (rolling) clearInterval(rolling);
    rolling = null;
    spinning = false;
    $t.spin.disabled = false;
    $t.spin.textContent = 'GIRAR';
    pool = [...sourcePool];
    lastPick = null;
    history = [];
    $t.exclude.disabled = false;
    renderParticipants();
    renderHistory();
    renderDrum();
    $t.drum.classList.add('no-anim');
    $t.drum.style.transform = 'translateY(0)';
    $t.drum.querySelectorAll('.name-item').forEach(el => el.classList.remove('active'));
  });
  $t.next.addEventListener('click', () => mirrorGo(nextGameUrl()));

  if (isCircuit) {
    $t.topProgress.classList.remove('hidden');
    $t.topProgress.textContent = 'JUEGO ' + (gi + 1) + ' / ' + sess.games.length;
    $t.next.classList.remove('hidden');
  }

  renderScoreboardTeams('#scoreboard');

  renderParticipants();
  renderHistory();
  renderDrum();
}
</script>
</body></html>
