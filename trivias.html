<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trivias - ULTRA ARENA</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Montserrat:wght@400;700;800;900&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = { darkMode: "class", theme: { extend: {
  colors: { "tertiary-fixed": "#56ffa8", "secondary-container": "#ff24e4", "secondary": "#fface8", "on-tertiary-fixed": "#002110", "surface-container-highest": "#2f3639", "on-tertiary-fixed-variant": "#00522f", "surface-tint": "#47d6ff", "tertiary-fixed-dim": "#00e38b", "primary": "#a5e7ff", "surface": "#0e1417", "on-error": "#690005", "outline-variant": "#3c494e", "surface-container-low": "#161d1f", "on-primary": "#003543", "on-primary-fixed-variant": "#004e60", "surface-dim": "#0e1417", "surface-container-high": "#242b2e", "error-container": "#93000a", "inverse-surface": "#dde3e7", "primary-fixed": "#b6ebff", "background": "#0e1417", "error": "#ffb4ab", "on-secondary-fixed": "#3a0033", "on-primary-container": "#00566a", "outline": "#859399", "tertiary-container": "#00dd87", "tertiary": "#00fd9b", "on-primary-fixed": "#001f28", "on-tertiary": "#00391f", "on-tertiary-container": "#005b35", "on-surface": "#dde3e7", "surface-bright": "#333a3d", "on-surface-variant": "#bbc9cf", "on-background": "#dde3e7", "on-secondary": "#5e0053", "surface-container-lowest": "#090f12", "on-error-container": "#ffdad6", "inverse-primary": "#00677f", "on-secondary-container": "#520049", "primary-container": "#00d2ff", "secondary-fixed-dim": "#fface8", "inverse-on-surface": "#2b3134", "surface-container": "#1a2123", "primary-fixed-dim": "#47d6ff", "on-secondary-fixed-variant": "#840076", "secondary-fixed": "#ffd7f0", "surface-variant": "#2f3639" },
  borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
  spacing: { unit: "8px", "margin-desktop": "64px", gutter: "24px", "margin-mobile": "16px", "container-max": "1440px" },
  fontFamily: { "label-caps": ["JetBrains Mono"], "display-lg-mobile": ["Montserrat"], "display-xl": ["Montserrat"], "body-lg": ["Inter"], "display-lg": ["Montserrat"], "body-md": ["Inter"], "headline-md": ["Montserrat"] },
  fontSize: { "label-caps": ["14px", { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "700" }], "display-lg-mobile": ["32px", { lineHeight: "1.2", fontWeight: "800" }], "display-xl": ["80px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "900" }], "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }], "display-lg": ["48px", { lineHeight: "1.2", fontWeight: "800" }], "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }], "headline-md": ["24px", { lineHeight: "1.4", fontWeight: "700" }] }
} } }
</script>
<style>
body { background-color: #0B0E14; background-image: radial-gradient(circle at top left, rgba(165,231,255,0.1) 0%, transparent 40%), radial-gradient(circle at bottom right, rgba(255,172,232,0.1) 0%, transparent 40%); background-attachment: fixed; min-height: 100vh; color: #dde3e7; }
.glass-panel { background: rgba(14,20,23,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid transparent; background-clip: padding-box; position: relative; }
.glass-panel::before { content: ''; position: absolute; top:0; right:0; bottom:0; left:0; z-index:-1; margin:-1px; border-radius:inherit; background: linear-gradient(135deg, rgba(165,231,255,0.3) 0%, transparent 50%, rgba(255,172,232,0.3) 100%); }
.btn-primary { background: linear-gradient(90deg, #47d6ff, #00d2ff); color: #003543; transition: all 0.3s ease; }
.btn-primary:hover { transform: scale(1.03); box-shadow: 0 0 15px rgba(0,210,255,0.6); }
.input-glow { background-color: #1a2123; border: none; border-bottom: 2px solid #859399; color: #dde3e7; transition: all 0.3s ease; }
.input-glow:focus { outline: none; border-bottom-color: #a5e7ff; box-shadow: 0 4px 10px -4px rgba(165,231,255,0.5); }
.q-row { transition: all 0.25s ease; }
</style>
<link rel="stylesheet" href="css/arena.css"/>
</head>
<body class="min-h-screen flex flex-col font-body-md">
<header class="bg-surface/60 backdrop-blur-xl border-b border-primary/20 shadow-[0_0_20px_rgba(71,214,255,0.1)] flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20 w-full z-50 sticky top-0">
<a href="index" class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tighter">ULTRA ARENA</a>
<div class="flex items-center gap-4">
  <button id="theme-toggle" class="p-2 rounded-full border border-primary/30 text-primary hover:bg-surface-container/50 transition-all" title="Cambiar tema"><span class="material-symbols-outlined">light_mode</span></button>
  <div class="font-headline-md text-headline-md text-primary">GESTIÓN DE TRIVIAS</div>
</div>
</header>

<main class="flex-1 p-margin-mobile md:p-margin-desktop pb-28">
  <div class="max-w-6xl mx-auto">
    <!-- LISTA -->
    <div id="list-view">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h1 class="font-headline-md text-headline-md text-primary">TRIVIAS DISPONIBLES</h1>
          <p class="font-body-md text-body-md text-on-surface-variant">Crea los sets de preguntas que usarás en circuitos.</p>
        </div>
        <button id="new-trivia" class="btn-primary rounded-xl px-6 py-3 font-label-caps text-label-caps">+ NUEVA TRIVIA</button>
      </div>
      <div id="trivia-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      <p id="list-empty" class="hidden font-body-md text-body-md text-on-surface-variant text-center py-10">No hay trivias todavía. Crea la primera.</p>
    </div>

    <!-- EDITOR -->
    <div id="editor-view" class="hidden">
      <button id="back-list" class="font-label-caps text-label-caps text-primary hover:text-tertiary transition-colors mb-4">← VOLVER A LA LISTA</button>
      <div class="glass-panel rounded-2xl p-8 flex flex-col gap-6">
        <h1 id="editor-title" class="font-headline-md text-headline-md text-primary">NUEVA TRIVIA</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="font-label-caps text-label-caps text-on-surface-variant" for="tv-title">Título</label>
            <input id="tv-title" class="input-glow w-full py-2 px-1 text-body-lg font-body-lg bg-transparent" placeholder="Ej: Trivia Bíblica"/>
          </div>
          <div>
            <label class="font-label-caps text-label-caps text-on-surface-variant" for="tv-category">Categoría</label>
            <select id="tv-category" class="input-glow w-full py-2 px-1 text-body-md font-body-md bg-surface-container"></select>
          </div>
          <div>
            <label class="font-label-caps text-label-caps text-on-surface-variant" for="tv-difficulty">Dificultad</label>
            <select id="tv-difficulty" class="input-glow w-full py-2 px-1 text-body-md font-body-md bg-surface-container"><option>Easy</option><option selected>Medium</option><option>Hard</option></select>
          </div>
          <div>
            <label class="font-label-caps text-label-caps text-on-surface-variant" for="tv-time">Tiempo por pregunta (seg, 0 = sin)</label>
            <input id="tv-time" type="number" min="0" value="15" class="input-glow w-full py-2 px-1 text-body-md font-body-md bg-transparent"/>
          </div>
        </div>
        <div class="border-t border-outline-variant pt-4">
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-label-caps text-label-caps text-secondary">PREGUNTAS (<span id="q-count">0</span>)</h2>
            <button id="add-question" class="btn-secondary px-4 py-2 rounded-lg font-label-caps text-label-caps border border-secondary/50 text-secondary hover:bg-secondary/10 transition-colors">+ AGREGAR PREGUNTA</button>
          </div>
          <div id="questions-editor" class="flex flex-col gap-4"></div>
          <p id="questions-empty" class="font-body-md text-body-md text-on-surface-variant text-center py-8">Sin preguntas todavía.</p>
        </div>
        <div class="flex gap-4 pt-2">
          <button id="save-trivia" class="btn-primary flex-1 py-4 rounded-xl font-label-caps text-label-caps uppercase tracking-wider">GUARDAR TRIVIA</button>
          <button id="cancel-edit" class="px-8 py-4 rounded-xl border border-outline-variant text-on-surface-variant font-label-caps text-label-caps hover:bg-surface-bright transition-colors">CANCELAR</button>
        </div>
        <p id="save-msg" class="hidden font-label-md text-label-md text-center text-tertiary"></p>
      </div>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firestore.js"></script>
<script src="js/arena.js"></script>
<script src="js/session.js"></script>
<script src="js/components.js"></script>
<script>
  const CATS = ['General', 'Ciencia', 'Historia', 'Geografía', 'Arte', 'Deportes', 'Música', 'Cine', 'Videojuegos', 'Cultura Pop', 'Biblia', 'Otro'];
  let trivias = [];
  let editing = null; // { id, title, category, difficulty, timeLimit, status, questions:[{text,options:[{text,correct}]}] }
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

  const $e = {
    listView: $('#list-view'), editorView: $('#editor-view'), list: $('#trivia-list'), listEmpty: $('#list-empty'),
    editorTitle: $('#editor-title'), title: $('#tv-title'), category: $('#tv-category'), difficulty: $('#tv-difficulty'),
    time: $('#tv-time'), qCount: $('#q-count'), questionsEditor: $('#questions-editor'), questionsEmpty: $('#questions-empty'),
    saveMsg: $('#save-msg')
  };

  // ---------- Lista ----------
  function renderList() {
    $e.listEmpty.classList.toggle('hidden', trivias.length > 0);
    $e.list.innerHTML = trivias.map(t => `
      <div class="glass-panel rounded-xl p-5 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <span class="font-label-caps text-label-caps text-primary bg-primary/10 px-2 py-1 rounded">${escapeHtml(t.category || 'General')}</span>
          <span class="font-label-caps text-label-caps ${t.status === 'published' ? 'text-tertiary' : 'text-on-surface-variant'}">${t.status === 'published' ? 'ACTIVA' : 'INACTIVA'}</span>
        </div>
        <h3 class="font-headline-md text-headline-md text-on-surface">${escapeHtml(t.title)}</h3>
        <p class="font-body-md text-body-md text-on-surface-variant">${Array.isArray(t.questions) ? t.questions.length : 0} preguntas · ${escapeHtml(t.difficulty || 'Medium')}</p>
        <div class="flex gap-2 pt-2 border-t border-outline-variant">
          <button data-id="${t.id}" class="t-edit flex-1 py-2 rounded-lg bg-primary/10 text-primary font-label-caps text-label-caps hover:bg-primary/20 transition-colors">EDITAR</button>
          <button data-id="${t.id}" class="t-dup p-2 rounded-lg border border-outline-variant text-on-surface-variant hover:text-primary transition-colors" title="Duplicar"><span class="material-symbols-outlined text-[18px]">content_copy</span></button>
          <button data-id="${t.id}" class="t-toggle p-2 rounded-lg border border-outline-variant text-on-surface-variant hover:text-tertiary transition-colors" title="Activar/Desactivar"><span class="material-symbols-outlined text-[18px]">power_settings_new</span></button>
          <button data-id="${t.id}" class="t-del p-2 rounded-lg border border-outline-variant text-on-surface-variant hover:text-error transition-colors" title="Eliminar"><span class="material-symbols-outlined text-[18px]">delete</span></button>
        </div>
      </div>`).join('');
    $$('.t-edit', $e.list).forEach(b => b.addEventListener('click', () => editTrivia(b.dataset.id)));
    $$('.t-dup', $e.list).forEach(b => b.addEventListener('click', () => duplicate(b.dataset.id)));
    $$('.t-toggle', $e.list).forEach(b => b.addEventListener('click', () => toggleTrivia(b.dataset.id)));
    $$('.t-del', $e.list).forEach(b => b.addEventListener('click', () => removeTrivia(b.dataset.id)));
  }

  async function load() {
    try { trivias = await getTriviasAll(); } catch (e) { console.error(e); }
    trivias.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    renderList();
  }

  // getTriviasAll devuelve también inactivas
  async function getTriviasAll() {
    const snap = await db.collection('trivias').limit(200).get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }

  // ---------- Editor ----------
  function openEditor() {
    $e.listView.classList.add('hidden');
    $e.editorView.classList.remove('hidden');
    $e.category.innerHTML = CATS.map(c => `<option ${editing.category === c ? 'selected' : ''}>${c}</option>`).join('');
    $e.title.value = editing.title;
    $e.difficulty.value = editing.difficulty || 'Medium';
    $e.time.value = editing.timeLimit || 15;
    $e.editorTitle.textContent = editing.id ? 'EDITAR TRIVIA' : 'NUEVA TRIVIA';
    renderQuestions();
    window.scrollTo({ top: 0 });
  }

  function renderQuestions() {
    $e.qCount.textContent = editing.questions.length;
    $e.questionsEmpty.classList.toggle('hidden', editing.questions.length > 0);
    $e.questionsEditor.innerHTML = editing.questions.map((q, qi) => `
      <div class="q-row glass-panel rounded-xl p-4 flex flex-col gap-3">
        <div class="flex items-start gap-3">
          <span class="w-8 h-8 rounded-full bg-primary-container text-primary font-label-caps text-label-caps flex items-center justify-center shrink-0">${qi + 1}</span>
          <textarea data-q="${qi}" class="q-text input-glow flex-1 py-1 px-1 text-body-lg font-body-lg bg-transparent resize-none" rows="2" placeholder="Texto de la pregunta">${escapeHtml(q.text)}</textarea>
          <button data-q="${qi}" class="q-del p-1 text-on-surface-variant hover:text-error transition-colors"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 pl-11">
          ${q.options.map((opt, oi) => `
            <div class="flex items-center gap-2">
              <input data-q="${qi}" data-o="${oi}" type="radio" name="correct_${qi}" class="opt-correct w-4 h-4 text-primary bg-surface border-outline focus:ring-primary" ${opt.correct ? 'checked' : ''}/>
              <input data-q="${qi}" data-o="${oi}" class="opt-text input-glow flex-1 py-1 px-1 text-body-md font-body-md bg-transparent" placeholder="Opción ${letters[oi]}" value="${escapeHtml(opt.text)}"/>
            </div>`).join('')}
          <button data-q="${qi}" class="q-opt-add text-left font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors pl-6">+ opción</button>
        </div>
      </div>`).join('');
    bindQuestionEvents();
  }

  function bindQuestionEvents() {
    $$('.q-text', $e.questionsEditor).forEach(inp => inp.addEventListener('input', () => { editing.questions[+inp.dataset.q].text = inp.value; }));
    $$('.opt-text', $e.questionsEditor).forEach(inp => inp.addEventListener('input', () => { editing.questions[+inp.dataset.q].options[+inp.dataset.o].text = inp.value; }));
    $$('.opt-correct', $e.questionsEditor).forEach(inp => inp.addEventListener('change', () => {
      const q = editing.questions[+inp.dataset.q];
      q.options.forEach(o => o.correct = false);
      q.options[+inp.dataset.o].correct = true;
    }));
    $$('.q-del', $e.questionsEditor).forEach(b => b.addEventListener('click', () => { editing.questions.splice(+b.dataset.q, 1); renderQuestions(); }));
    $$('.q-opt-add', $e.questionsEditor).forEach(b => b.addEventListener('click', () => {
      const q = editing.questions[+b.dataset.q];
      if (q.options.length >= 6) return;
      q.options.push({ text: '', correct: false });
      renderQuestions();
    }));
  }

  function editTrivia(id) {
    const t = trivias.find(x => x.id === id);
    editing = { id, title: t.title || '', category: t.category || 'General', difficulty: t.difficulty || 'Medium', timeLimit: t.timeLimit || 15, status: t.status || 'published', questions: (t.questions || []).map(q => ({ text: q.text, options: q.options.map(o => ({ text: o.text, correct: !!o.correct })) })) };
    openEditor();
  }

  function newTrivia() {
    editing = { id: null, title: '', category: 'General', difficulty: 'Medium', timeLimit: 15, status: 'published', questions: [] };
    openEditor();
  }

  // ---------- Acciones ----------
  async function save() {
    const title = $e.title.value.trim();
    if (!title) { alert('Escribe un título.'); return; }
    const questions = editing.questions.filter(q => q.text.trim()).map(q => ({
      text: q.text.trim(),
      options: q.options.filter(o => o.text.trim()).map(o => ({ text: o.text.trim(), correct: !!o.correct }))
    })).filter(q => q.options.length >= 2);
    if (questions.some(q => !q.options.some(o => o.correct))) { alert('Cada pregunta debe tener una opción correcta marcada.'); return; }
    const data = { title, category: $e.category.value, difficulty: $e.difficulty.value, timeLimit: Math.max(0, +$e.time.value || 15), questions, status: editing.status || 'published', updatedAt: Date.now() };
    try {
      if (editing.id) { await updateTrivia(editing.id, data); }
      else { await createTrivia(data); }
      $e.saveMsg.classList.remove('hidden');
      $e.saveMsg.textContent = '✓ Trivia guardada correctamente.';
      setTimeout(() => $e.saveMsg.classList.add('hidden'), 2500);
      editing = null;
      backToList();
    } catch (err) {
      console.error(err);
      alert('No se pudo guardar. Revisa la configuración de Firebase.');
    }
  }

  async function duplicate(id) {
    const t = trivias.find(x => x.id === id);
    if (!t) return;
    const data = { title: (t.title || '') + ' (copia)', category: t.category || 'General', difficulty: t.difficulty || 'Medium', timeLimit: t.timeLimit || 15, questions: t.questions || [], status: 'published' };
    await createTrivia(data);
    await load();
  }

  async function toggleTrivia(id) {
    const t = trivias.find(x => x.id === id);
    if (!t) return;
    await updateTrivia(id, { status: t.status === 'published' ? 'draft' : 'published' });
    await load();
  }

  async function removeTrivia(id) {
    if (!confirm('¿Eliminar esta trivia?')) return;
    await deleteTrivia(id);
    await load();
  }

  function backToList() {
    $e.editorView.classList.add('hidden');
    $e.listView.classList.remove('hidden');
    load();
  }

  $('#new-trivia').addEventListener('click', newTrivia);
  $('#back-list').addEventListener('click', backToList);
  $('#cancel-edit').addEventListener('click', backToList);
  $('#save-trivia').addEventListener('click', save);
  $('#add-question').addEventListener('click', () => { editing.questions.push({ text: '', options: [{ text: '', correct: true }, { text: '', correct: false }] }); renderQuestions(); });

  load();
</script>
</body></html>
