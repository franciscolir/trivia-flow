<style>
        body {
            background-color: #0B0E14; /* Deep Navy */
            background-image: radial-gradient(circle at top left, rgba(165, 231, 255, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at bottom right, rgba(255, 36, 228, 0.1) 0%, transparent 40%);
            color: #dde3e7;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(14, 20, 23, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid transparent;
            background-clip: padding-box;
            position: relative;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: -1;
            margin: -1px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(165, 231, 255, 0.3) 0%, transparent 50%, rgba(255, 172, 232, 0.3) 100%);
        }

        .game-card { transition: all 0.3s ease; cursor: pointer; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(165, 231, 255, 0.4); border-color: rgba(165, 231, 255, 0.8); }
        .game-card:hover .icon-container { transform: scale(1.1); }

        .btn-primary { background: linear-gradient(90deg, #47d6ff, #00d2ff); color: #003543; transition: all 0.3s ease; }
        .btn-primary:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(0, 210, 255, 0.6); }
    </style>
<link rel="stylesheet" href="css/arena.css"/>

<body class="min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopAppBar -->
<header class="bg-surface/60 backdrop-blur-xl border-b border-primary/20 shadow-[0_0_20px_rgba(71,214,255,0.1)] fixed docked full-width top-0 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20 w-full z-50">
<a href="index.html" class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tighter">ULTRA ARENA</a>
<div class="flex items-center gap-4">
  <button id="mute-toggle" class="p-2 rounded-full border border-primary/30 text-primary hover:bg-surface-container/50 transition-all" title="Silenciar sonido"><span class="material-symbols-outlined">volume_up</span></button>
<button id="theme-toggle" class="p-2 rounded-full border border-primary/30 text-primary hover:bg-surface-container/50 transition-all" title="Cambiar tema">
    <span class="material-symbols-outlined">light_mode</span>
  </button>
  <div id="top-progress" class="hidden text-primary font-headline-md text-headline-md bg-surface-container/50 px-4 py-2 rounded-lg border border-primary/30">JUEGO 1 / 1</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="has-scorebar flex-grow pt-28 md:pt-24 pb-24 md:pb-20 px-margin-mobile md:pl-8 md:pr-8 lg:pl-10 lg:pr-10 max-w-container-max mx-auto w-full flex flex-col gap-8">
<div class="text-center mb-8">
<h1 class="font-display-xl text-display-xl text-on-surface drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">CENTRO DE JUEGOS</h1>
<p class="font-body-lg text-body-lg text-primary mt-2">SELECCIONA TU DESAFÍO</p>
</div>
<!-- Path 1: Individual Play -->
<section class="flex flex-col gap-gutter">
<h2 class="font-headline-md text-headline-md text-secondary border-b border-secondary/30 pb-2 w-max pr-8 uppercase tracking-widest flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">person</span>
                JUGAR INDIVIDUAL
            </h2>
<div id="individual-games" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</section>
<!-- Path 2: Create Circuit -->
<section class="flex flex-col items-center justify-center py-12">
<a href="create.html" class="btn-primary rounded-xl px-12 py-6 flex items-center gap-4 font-headline-md text-headline-md uppercase tracking-wider group">
<span class="material-symbols-outlined text-3xl group-hover:animate-pulse" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
                CREAR CIRCUITO
            </a>
<p class="font-body-md text-body-md text-on-surface-variant mt-4 text-center max-w-md">
                Configura una secuencia personalizada de juegos para un torneo completo.
            </p>
<a href="trivias" class="mt-4 font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2">
<span class="material-symbols-outlined">edit_note</span> GESTIÓN DE TRIVIAS
</a>
<a href="content" class="mt-2 font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2">
<span class="material-symbols-outlined">grid_view</span> GESTIÓN DE CONTENIDOS
</a>
</section>
</main>
<!-- Marcador lateral derecho (barra inferior en móvil) -->
<aside id="scorebar" class="fixed z-40 flex flex-col right-0 top-20 bottom-0 w-48 sm:w-56 md:w-64 border-l border-primary/30 bg-surface-container-highest/85 backdrop-blur-md shadow-[-10px_0_30px_rgba(0,0,0,0.5)] max-md:top-auto max-md:left-0 max-md:right-0 max-md:bottom-0 max-md:w-full max-md:h-24 max-md:flex-row max-md:border-l-0 max-md:border-t max-md:rounded-t-xl max-md:shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
<div class="shrink-0 px-4 py-2.5 border-b border-primary/20 font-label-caps text-label-caps text-secondary uppercase tracking-wider max-md:hidden">MARCADOR</div>
<div id="circuit-progress" class="hidden border-b border-primary/20"></div>
   <div id="scoreboard" class="flex flex-1 flex-col overflow-y-auto max-md:flex-row max-md:overflow-x-auto max-md:overflow-y-hidden"></div>
</aside>
<script src="js/arena.js"></script>
<script src="js/turn.js"></script>
<script src="js/timer.js"></script>
<script src="js/game.js"></script>
<script src="js/registry.js"></script>
<script src="js/session.js"></script>
<script src="js/components.js"></script>
<script>
  if (!isPublic()) {
  initSessionFromUrlOrLocal();
  const _sess = getSession();
  const _prog = document.getElementById('top-progress');
  if (_sess && Array.isArray(_sess.games) && _sess.games.length) {
    const _gi = getGameIndexFromUrl();
    _prog.textContent = 'JUEGO ' + Math.min(_gi + 1, _sess.games.length) + ' / ' + _sess.games.length;
    _prog.classList.remove('hidden');
  }
  // Tarjetas individuales desde el GameRegistry
  const _grid = document.getElementById('individual-games');
  if (_grid) {
    _grid.innerHTML = GameRegistry.getAvailableGames()
      .filter(g => g.enabled !== false && g.supportsIndividual)
      .map(g => `<a href="${g.page}?gi=0" class="glass-panel game-card rounded-xl p-6 flex flex-col items-center justify-center text-center gap-4 min-h-[200px] border border-outline-variant group">
        <div class="icon-container bg-surface-container-high p-4 rounded-full border border-primary/20 transition-transform duration-300">
          <span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">${g.icon}</span>
        </div>
        <h3 class="font-label-caps text-label-caps text-on-surface">${g.name.toUpperCase()}</h3>
      </a>`).join('');
  }
  renderScoreboardTeams('#scoreboard');
  offerRecovery();
}
</script>
</body></html>
