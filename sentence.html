<script>
  const BANK = [
    { text: 'El perro saliÃ³ corriendo porque ___', answer: 'tenÃ­a miedo' },
    { text: 'Para llegar a tiempo tuvimos que ___', answer: 'apresurarnos' },
    { text: 'Si no estudias, probablemente ___', answer: 'repruebes' },
    { text: 'Cuando entramos al cine, ya ___', answer: 'empezaba la pelÃ­cula' },
    { text: 'Me comprÃ© este abrigo porque ___', answer: 'hace mucho frÃ­o' },
    { text: 'El niÃ±o no querÃ­a dormir porque ___', answer: 'tenÃ­a pesadillas' },
    { text: 'DespuÃ©s de la lluvia, el cielo quedÃ³ ___', answer: 'despejado' },
    { text: 'No pudimos salir porque ___', answer: 'estaba lloviendo' },
    { text: 'El equipo celebrÃ³ porque ___', answer: 'ganÃ³ el campeonato' },
    { text: 'Si ahorras cada mes, en un aÃ±o ___', answer: 'tendrÃ¡s suficiente' }
  ];
  if (!isPublic()) {

  initSessionFromUrlOrLocal();
  const gi = getGameIndexFromUrl();
  const sess = getSession();
  if (sess.games && sess.games.length) sess.currentGameIndex = gi;
  const cfg = getCurrentGame();
  const isCircuit = !!(sess && sess.mode === 'circuit' && sess.games && sess.games.length);
  const settings = (cfg && cfg.settings) || {};
  const Q_TIME = settings.questionTime || 30;
  const PENALTY = settings.penalty || 0;
  const PTS = (cfg && cfg.points) || 10;
  const roundTeams = isCircuit && sess.teams && sess.teams.length ? sess.teams.slice() : [{ id: 'solo', name: 'JUGADOR', color: 'primary' }];
  let bankActive = BANK;

  let decks = [], roundIndex = -1, qIndex = 0, correct = 0, teamStats = {};
  const qTimer = new TimerManager();

  const $s = {
    timer: $('#timer'), roundInfo: $('#round-info'), roundLabel: $('#round-label'), roundTeam: $('#round-team'), roundStats: $('#round-stats'),
    gameLabel: $('#game-label'), question: $('#question-text'), timedAnswer: $('#timed-answer'), roundControls: $('#round-controls'),
    nextBtn: $('#next-game'), restart: $('#restart'), goHome: $('#go-home'), topProgress: $('#top-progress'),
    btnCorrect: $('#btn-correct'), btnIncorrect: $('#btn-incorrect')
  };

  function fmtTime(s) { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

  function dealDecks() {
    const n = Math.max(1, roundTeams.length);
    const shuffled = shuffleArray(bankActive);
    const per = Math.max(1, Math.floor(shuffled.length / n));
    const out = [];
    let idx = 0;
    for (let i = 0; i < n; i++) { out.push(shuffled.slice(idx, idx + per)); idx += per; }
    return out;
  }

  function startRound(i) {
    roundIndex = i; qIndex = 0; correct = 0;
    const team = roundTeams[i];
    if (team) teamStats[team.id] = 0;
    $s.roundInfo.classList.remove('hidden');
    $s.roundControls.classList.remove('hidden');
    $s.roundLabel.textContent = 'RONDA ' + (i + 1) + ' / ' + roundTeams.length;
    $s.roundTeam.textContent = 'EQUIPO: ' + (team ? team.name : '');
    renderQuestion();
  }

  function renderQuestion() {
    const deck = decks[roundIndex] || [];
    const s = deck[qIndex];
    if (!s) { endRound(); return; }
    $s.gameLabel.textContent = (cfg ? cfg.name : 'COMPLETAR LA ORACIÃ“N').toUpperCase();
    $s.question.textContent = s.text;
    $s.timedAnswer.textContent = s.answer;
    $s.roundStats.textContent = 'ACIERTOS: ' + correct + ' Â· PREGUNTA ' + (qIndex + 1) + '/' + deck.length;
    qTimer.start(Q_TIME,
      (sec) => { $s.timer.textContent = fmtTime(sec); playTick(); $s.timer.classList.toggle('timer-pulse', sec <= 10); },
      () => mark(false));
  }

  function mark(ok) {
    qTimer.stop();
    if (ok) { correct++; if (isCircuit && roundTeams[roundIndex]) addScore(roundTeams[roundIndex].id, PTS, 'OraciÃ³n', cfg ? cfg.id : null); playCorrect(); }
    else { playWrong(); if (PENALTY && isCircuit && roundTeams[roundIndex]) subtractScore(roundTeams[roundIndex].id, PENALTY, 'PenalizaciÃ³n oraciÃ³n', cfg ? cfg.id : null); }
    nextQuestion();
  }

  function nextQuestion() {
    const deck = decks[roundIndex] || [];
    if (qIndex + 1 >= deck.length) endRound();
    else { qIndex++; renderQuestion(); }
  }

  function endRound() {
    qTimer.stop();
    const team = roundTeams[roundIndex];
    if (team && team.id !== 'solo') teamStats[team.id] = correct;
    if (roundIndex + 1 < roundTeams.length) startRound(roundIndex + 1);
    else finishGame();
  }

  function finishGame() {
    playFinish();
    if (isCircuit) {
      const ranked = roundTeams.filter(t => t.id !== 'solo').slice().sort((a, b) => (teamStats[b.id] || 0) - (teamStats[a.id] || 0));
      const winner = ranked[0];
      const stats = {};
      roundTeams.forEach(t => { stats[t.id] = teamStats[t.id] || 0; });
      const result = buildResult({
        gameId: cfg ? cfg.id : null,
        winnerTeamId: winner ? winner.id : null,
        rankings: getRanking(),
        pointsAwarded: { winner: winner ? getTeamScore(winner.id) : 0 },
        statistics: { perTeam: stats, questionTime: Q_TIME }
      });
      sess.lastResult = result;
      logEvent('GAME_FINISHED', { gameId: cfg ? cfg.id : null, winnerTeamId: winner ? winner.id : null, result });
      persistSession();
      const afterWord = () => showGameResult({
        title: 'FIN DE JUEGO', subtitle: winner ? winner.name : 'Sin puntos',
        rankings: getRanking(), nextLabel: 'SIGUIENTE JUEGO â†’',
        onNext: () => mirrorGo(nextGameUrl()), onHome: () => mirrorGo('index')
      });
      resolveGameReward(winner, afterWord);
    } else {
      $s.roundControls.classList.add('hidden');
      $s.roundInfo.classList.add('hidden');
      $s.gameLabel.textContent = 'RESULTADO';
      $s.question.textContent = 'Aciertos: ' + (teamStats['solo'] || 0) + ' / ' + ((decks[0] || []).length);
      $s.timedAnswer.textContent = '';
      $s.goHome.classList.remove('hidden');
    }
  }

  $s.btnCorrect.addEventListener('click', () => mark(true));
  $s.btnIncorrect.addEventListener('click', () => mark(false));
  $s.restart.addEventListener('click', () => { decks = dealDecks(); startRound(0); });
  $s.nextBtn.addEventListener('click', () => mirrorGo(nextGameUrl()));

  if (isCircuit) $s.topProgress.textContent = 'JUEGO ' + (gi + 1) + ' / ' + sess.games.length;
  else $s.topProgress.textContent = 'JUGAR INDIVIDUAL';
  $s.gameLabel.textContent = (cfg ? cfg.name : 'COMPLETAR LA ORACIÃ“N').toUpperCase();
  if (sess && sess.word && sess.word.active) mountWordBar('#wordbar');
  renderScoreboardTeams('#scoreboard');
  loadGameContent(cfg).then(items => {
    if (items && items.length >= 1) {
      const mapped = items.map(i => ({ text: i.text, answer: i.missing })).filter(s => s.text && s.answer);
      if (mapped.length >= 1) bankActive = mapped;
    }
    decks = dealDecks();
    startRound(0);
  });
}
</script>
