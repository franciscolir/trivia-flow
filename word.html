      } } }
    </script>
<style>
        .glass-panel { background: rgba(14,20,23,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

<body class="bg-background text-on-background min-h-screen overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container relative">

<div class="absolute top-1/4 left-1/4 w-[800px] h-[800px] bg-primary/10 rounded-full blur-[120px] mix-blend-screen opacity-50"></div>
<div class="absolute bottom-1/4 right-1/4 w-[600px] h-[600px] bg-secondary/10 rounded-full blur-[100px] mix-blend-screen opacity-30"></div>
</div>
<nav class="bg-surface/60 backdrop-blur-xl border-b border-primary/20 shadow-[0_0_20px_rgba(71,214,255,0.1)] flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20 w-full z-50 fixed top-0 left-0">
<a href="index" class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tighter">ULTRA ARENA</a>
<div class="flex items-center gap-4">
  <button id="theme-toggle" class="p-2 rounded-full border border-primary/30 text-primary hover:bg-surface-container/50 transition-all" title="Cambiar tema"><span class="material-symbols-outlined">light_mode</span></button>
  <div id="top-progress" class="text-primary font-headline-md text-headline-md font-bold border-b-2 border-primary pb-1">PALABRA</div>
</div>

<main class="relative z-10 pt-28 pb-32 px-margin-mobile md:px-margin-desktop min-h-screen flex flex-col items-center justify-center gap-10">
<div class="text-center w-full max-w-4xl">

</div>
<div id="grid" class="grid grid-cols-4 gap-4 md:gap-gutter w-full max-w-3xl aspect-square"></div>
<div id="word-box" class="glass-panel border border-primary/20 px-12 py-8 rounded-2xl shadow-[0_0_30px_rgba(71,214,255,0.05)] w-full max-w-4xl text-center">
<div class="font-label-caps text-label-caps text-on-surface-variant mb-6 uppercase tracking-[0.2em]">Palabra Oculta</div>
<div id="word-display" class="flex items-center justify-center gap-4 md:gap-8 font-display-xl text-display-xl text-primary glow-text-primary tracking-widest flex-wrap"></div>
</div>
<div id="message" class="hidden text-center w-full max-w-4xl">
<div class="glass-panel border-2 border-tertiary/50 rounded-2xl p-10 flash-animation">
<h2 class="font-display-xl text-display-lg-mobile md:text-display-xl text-tertiary uppercase tracking-widest mb-4">¡Palabra Descubierta!</h2>
<div id="message-word" class="font-display-xl text-display-xl text-on-surface tracking-[0.3em] mb-6"></div>
<p id="reward-text" class="font-body-lg text-body-lg text-on-surface-variant">Todos los equipos: +5 puntos</p>
<div class="flex flex-wrap justify-center gap-4 mt-8">
<button id="next-game" class="hidden btn-primary rounded-xl px-10 py-4 font-label-caps text-label-caps uppercase tracking-wider">SIGUIENTE JUEGO →</button>
<a href="index" class="px-8 py-4 rounded-xl border border-outline-variant text-on-surface font-label-caps transition-colors hover:bg-surface-bright">INICIO</a>
</div>
</div>
</div>
</main>
<nav class="bg-surface-container-highest/90 backdrop-blur-md border-t border-primary/30 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] fixed bottom-0 left-0 w-full z-50 rounded-t-xl">
<div id="scoreboard" class="flex justify-around items-center h-24 px-4 overflow-x-auto"></div>
</nav>

<script src="js/sounds.js"></script>
<script src="js/arena.js"></script>
<script src="js/turn.js"></script>
<script src="js/timer.js"></script>
<script src="js/game.js"></script>
<script src="js/registry.js"></script>
<script src="js/session.js"></script>
<script src="js/components.js"></script>
<script>
  initSessionFromUrlOrLocal();
  const gi = getGameIndexFromUrl();
  const sess = getSession();
  if (sess.games && sess.games.length) sess.currentGameIndex = gi;
  const isCircuit = !!(sess && sess.mode === 'circuit' && sess.games && sess.games.length);
  const cfg = getCurrentGame();

  // Palabra: usa la sesión si está activa; si no, una de demostración.
  const sessionWord = sess && sess.word && sess.word.active && sess.word.text;
  const WORD = sessionWord ? sess.word.text : (cfg && cfg.settings && cfg.settings.word ? cfg.settings.word : 'CONCURSO').toUpperCase();
  const cells = sessionWord ? (sess.word.cells && sess.word.cells.length ? sess.word.cells.map(c => ({ ...c })) : buildWordCells(WORD, 16)) : buildWordCells(WORD, 16);
  const revealed = sessionWord ? new Set(sess.word.revealed || []) : new Set();
  let done = false;

  const $w = { grid: $('#grid'), wordDisplay: $('#word-display'), message: $('#message'), messageWord: $('#message-word'), rewardText: $('#reward-text'), next: $('#next-game'), gameLabel: $('#game-label'), topProgress: $('#top-progress') };

  function renderWord() {
    $w.wordDisplay.innerHTML = WORD.split('').map((l, i) => revealed.has(i)
      ? `<span>${l}</span>`
      : `<span class="text-white/20 border-b-4 border-white/20 w-10 h-14 md:w-16 md:h-24 flex items-end justify-center pb-2">_</span>`).join('');
  }

  function renderGrid() {
    $w.grid.innerHTML = cells.map((c, i) => {
      const base = 'tile glass-panel border rounded-xl flex flex-col items-center justify-center';
      if (c.discovered) {
        let inner = c.type === 'letter' ? `<span class="font-display-lg text-display-lg-mobile md:text-display-lg font-bold">${c.letter}</span>` : '';
        if (c.type === 'clue') inner = `<span class="material-symbols-outlined text-secondary text-3xl">lightbulb</span>`;
        if (c.type === 'prize') inner = `<span class="material-symbols-outlined text-tertiary text-3xl">stars</span>`;
        if (c.type === 'bonus') inner = `<span class="material-symbols-outlined text-secondary-container text-3xl">add_circle</span>`;
        if (c.type === 'via') inner = `<span class="material-symbols-outlined text-tertiary-fixed text-3xl">route</span>`;
        if (c.type === 'empty') inner = `<span class="material-symbols-outlined text-outline-variant text-3xl">block</span>`;
        return `<button disabled class="${base} ${c.type === 'letter' ? 'border-primary/60' : c.type === 'empty' ? 'border-outline-variant' : 'border-secondary/50'}">${inner}</button>`;
      }
      return `<button data-i="${i}" class="${base} border-outline-variant group relative overflow-hidden">
        <span class="font-display-lg text-display-lg-mobile md:text-display-lg text-surface-variant group-hover:text-primary/50 transition-colors font-bold">${i + 1}</span>
      </button>`;
    }).join('');
    $$('[data-i]', $w.grid).forEach(b => b.addEventListener('click', () => openCell(+b.dataset.i)));
  }

  function syncSession() {
    if (!sessionWord) return;
    sess.word.revealed = Array.from(revealed);
    cells.forEach((c, i) => { sess.word.cells[i].discovered = c.discovered; });
    persistSession();
    updateWordBar();
  }

  function openCell(i) {
    const c = cells[i];
    if (c.discovered || done) return;
    c.discovered = true;
    if (c.type === 'letter') {
      WORD.split('').forEach((l, p) => { if (l === c.letter) revealed.add(p); });
      playCorrect();
    } else if (c.type === 'clue') {
      playTick();
    } else if (c.type === 'prize') {
      const leader = getRanking()[0]; if (leader) addScore(leader.id, 5, 'Premio de casilla', 'word');
      playFinish();
    } else if (c.type === 'bonus') {
      const leader = getRanking()[0]; if (leader) addScore(leader.id, 5, 'Bonus de casilla', 'word');
      playFinish();
    } else if (c.type === 'via') {
      const hidden = WORD.split('').map((l, p) => p).filter(p => !revealed.has(p));
      if (hidden.length) revealed.add(hidden[Math.floor(Math.random() * hidden.length)]);
      playCorrect();
    } else {
      playWrong();
    }
    syncSession();
    renderGrid();
    renderWord();
    checkComplete();
  }

  function checkComplete() {
    if (done || revealed.size < WORD.length) return;
    done = true;
    if (sessionWord) { if (!isWordComplete()) completeWord(); }
    playFinish();
    $w.grid.classList.add('hidden');
    $w.wordDisplay.classList.add('hidden');
    $w.messageWord.textContent = WORD.split('').join(' ');
    $w.rewardText.textContent = sessionWord ? ('Todos los equipos: +' + sess.word.rewardAll + ' puntos') : 'Todos los equipos: +5 puntos';
    $w.message.classList.remove('hidden');
    if (isCircuit) $w.next.classList.remove('hidden');
  }

  renderGrid();
  renderWord();
  $w.next.addEventListener('click', () => window.location.href = nextGameUrl());

  if (isCircuit) {
    $w.topProgress.textContent = 'JUEGO ' + (gi + 1) + ' / ' + sess.games.length;
    $w.gameLabel.innerHTML = 'Nivel <span class="text-primary glow-text-primary">' + escapeHtml((cfg && cfg.name) || 'Descubre la Palabra') + '</span>';
  } else {
    $w.topProgress.textContent = 'JUGAR INDIVIDUAL';
    $w.gameLabel.innerHTML = 'Nivel <span class="text-primary glow-text-primary">Descubre la Palabra</span>';
  }
  renderScoreboardTeams('#scoreboard');
</script>
