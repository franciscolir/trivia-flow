                    "error": "#ffb4ab", "on-secondary-fixed": "#3a0033", "on-primary-container": "#00566a", "outline": "#859399",

            "spacing": { "unit": "8px", "margin-desktop": "64px", "gutter": "24px", "margin-mobile": "16px", "container-max": "1440px" },

                    "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "800" }],
                    "display-xl": ["80px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "900" }],
                    "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                    "display-lg": ["48px", { "lineHeight": "1.2", "fontWeight": "800" }],
                    "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                    "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "700" }]
            }
          }
        }
      }
    </script>
<style>
        .glass-panel { background: rgba(14, 20, 23, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .glow-text-primary { text-shadow: 0 0 20px rgba(165, 231, 255, 0.6); }
        .flash-animation { animation: holographicFlash 2s infinite alternate; }
        @keyframes holographicFlash { 0% { box-shadow: 0 0 20px rgba(0, 210, 255, 0.4), inset 0 0 10px rgba(0, 210, 255, 0.2); } 100% { box-shadow: 0 0 50px rgba(0, 210, 255, 0.8), inset 0 0 30px rgba(0, 210, 255, 0.5); border-color: rgba(165, 231, 255, 1); } }
        .tile { transition: all 0.25s ease; }
        .tile:hover:not(:disabled) { border-color: rgba(165, 231, 255, 0.6); box-shadow: 0 0 15px rgba(165, 231, 255, 0.2); transform: translateY(-2px); }
        .tile:disabled { cursor: default; }
        html.light .flash-animation { animation: none; }
    </style>
<link rel="stylesheet" href="css/arena.css"/>
</head>
<body class="bg-background text-on-background min-h-screen overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container relative">
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-1/4 left-1/4 w-[800px] h-[800px] bg-primary/10 rounded-full blur-[120px] mix-blend-screen opacity-50"></div>
<div class="absolute bottom-1/4 right-1/4 w-[600px] h-[600px] bg-secondary/10 rounded-full blur-[100px] mix-blend-screen opacity-30"></div>
</div>
<!-- TopAppBar -->
<nav class="bg-surface/60 backdrop-blur-xl border-b border-primary/20 shadow-[0_0_20px_rgba(71,214,255,0.1)] flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20 w-full z-50 fixed top-0 left-0">
<a href="index.html" class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tighter">ULTRA ARENA</a>
<div class="flex items-center gap-4">
  <button id="theme-toggle" class="p-2 rounded-full border border-primary/30 text-primary hover:bg-surface-container/50 transition-all" title="Cambiar tema">
    <span class="material-symbols-outlined">light_mode</span>
  </button>
  <div id="top-progress" class="text-primary font-headline-md text-headline-md font-bold border-b-2 border-primary pb-1">JUEGO 3 / 5</div>
</div>
</nav>
<main class="relative z-10 pt-28 pb-32 px-margin-mobile md:px-margin-desktop md:ml-0 min-h-screen flex flex-col items-center justify-center gap-12">
<div class="text-center w-full max-w-4xl">
<h1 id="game-label" class="font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface uppercase tracking-wider mb-2">Nivel <span class="text-primary glow-text-primary">Avanzado</span></h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Selecciona un panel para revelar pistas o letras.</p>
</div>
<div id="grid" class="grid grid-cols-4 gap-4 md:gap-gutter w-full max-w-3xl aspect-square"></div>
<div id="word-box" class="mt-8 glass-panel border border-primary/20 px-12 py-8 rounded-2xl shadow-[0_0_30px_rgba(71,214,255,0.05)] w-full max-w-4xl text-center">
<div class="font-label-caps text-label-caps text-on-surface-variant mb-6 uppercase tracking-[0.2em]">Palabra Oculta</div>
<div id="word-display" class="flex items-center justify-center gap-4 md:gap-8 font-display-xl text-display-xl text-primary glow-text-primary tracking-widest flex-wrap"></div>
</div>
<div id="message" class="hidden text-center w-full max-w-4xl">
<div class="glass-panel border-2 border-tertiary/50 rounded-2xl p-10 flash-animation">
<h2 class="font-display-xl text-display-lg-mobile md:text-display-xl text-tertiary uppercase tracking-widest mb-4">¡Palabra Descubierta!</h2>
<div id="message-word" class="font-display-xl text-display-xl text-on-surface tracking-[0.3em] mb-6"></div>
<p id="reward-text" class="font-body-lg text-body-lg text-on-surface-variant">Todos los grupos: +5 puntos · Grupo que completó: +10</p>
<div class="flex flex-wrap justify-center gap-4 mt-8">
<button id="next-game" class="btn-primary rounded-xl px-10 py-4 font-label-caps text-label-caps uppercase tracking-wider">SIGUIENTE JUEGO →</button>
<a href="index.html" class="px-8 py-4 rounded-xl border border-outline-variant text-on-surface font-label-caps transition-colors hover:bg-surface-bright">INICIO</a>
</div>
</div>
</div>
</main>
<!-- Scoreboard -->
<nav class="bg-surface-container-highest/90 backdrop-blur-md border-t border-primary/30 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-24 px-4 pb-safe rounded-t-xl">
<div class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-2"><span class="material-symbols-outlined text-error mb-1" style="font-variation-settings: 'FILL' 1;">groups</span><span class="font-label-caps text-label-caps whitespace-nowrap">RED TEAM: <span class="text-error" data-score="rojo">0</span></span></div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-2"><span class="material-symbols-outlined text-primary mb-1" style="font-variation-settings: 'FILL' 1;">groups</span><span class="font-label-caps text-label-caps whitespace-nowrap">BLUE TEAM: <span class="text-primary" data-score="azul">0</span></span></div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-2"><span class="material-symbols-outlined text-tertiary mb-1" style="font-variation-settings: 'FILL' 1;">groups</span><span class="font-label-caps text-label-caps whitespace-nowrap">GREEN TEAM: <span class="text-tertiary" data-score="verde">0</span></span></div>
</nav>

<script src="js/sounds.js"></script>
<script src="js/arena.js"></script>
<script>
  const circuit = getCircuit();
  const gi = getGameIndex();
  const cfg = circuit && circuit.games && circuit.games[gi] ? circuit.games[gi] : null;
  const settings = (cfg && cfg.settings) || {};
  const WORD = (settings.word || 'CONCURSO').toUpperCase();
  const CLUES = settings.clues || ['Es un concurso', 'Letras ocultas', 'Una pista'];

  let cells = [];
  let revealedPositions = new Set();
  let done = false;

  const $w = {
    grid: $('#grid'), wordDisplay: $('#word-display'), message: $('#message'),
    messageWord: $('#message-word'), rewardText: $('#reward-text'), next: $('#next-game'),
    gameLabel: $('#game-label'), topProgress: $('#top-progress'), gridBox: $('#grid')
  };

  function buildCells() {
    const letters = WORD.split('');
    cells = letters.map((letter, pos) => ({ id: 'cell-' + pos, type: 'letter', letter, pos, discovered: false }));
    // Rellenar hasta 16 con casillas especiales
    const specials = [
      { type: 'clue', text: CLUES[0] || 'Pista' },
      { type: 'clue', text: CLUES[1] || 'Pista' },
      { type: 'prize', text: 'Premio' },
      { type: 'bonus', text: 'Bonus' },
      { type: 'via', text: 'Vía Libre' },
      { type: 'empty', text: 'Vacío' },
      { type: 'prize', text: 'Premio' },
      { type: 'bonus', text: 'Bonus' },
      { type: 'empty', text: 'Vacío' },
      { type: 'via', text: 'Vía Libre' }
    ];
    let s = 0;
    while (cells.length < 16) { cells.push({ id: 'cell-' + cells.length, ...specials[s++], discovered: false }); }
    cells = shuffleArray(cells).map((c, i) => ({ ...c, id: 'cell-' + i }));
  }

  function renderWord() {
    $w.wordDisplay.innerHTML = WORD.split('').map((letter, i) => {
      const shown = revealedPositions.has(i);
      return shown
        ? `<span>${letter}</span>`
        : `<span class="text-white/20 border-b-4 border-white/20 w-10 h-14 md:w-16 md:h-24 flex items-end justify-center pb-2">_</span>`;
    }).join('');
  }

  function renderGrid() {
    $w.grid.innerHTML = cells.map((c, i) => {
      const base = 'tile glass-panel border rounded-xl flex flex-col items-center justify-center';
      if (c.discovered) {
        let inner = `<span class="font-display-lg text-display-lg-mobile md:text-display-lg font-bold">${escapeHtml(c.type === 'letter' ? c.letter : '')}</span>`;
        if (c.type === 'clue') inner = `<span class="font-label-caps text-label-caps text-secondary mb-1">PISTA</span><span class="material-symbols-outlined text-secondary text-3xl">lightbulb</span>`;
        if (c.type === 'prize') inner = `<span class="font-label-caps text-label-caps text-tertiary mb-1">PREMIO</span><span class="material-symbols-outlined text-tertiary text-3xl">stars</span>`;
        if (c.type === 'bonus') inner = `<span class="font-label-caps text-label-caps text-secondary-container mb-1">BONUS</span><span class="material-symbols-outlined text-secondary-container text-3xl">add_circle</span>`;
        if (c.type === 'via') inner = `<span class="font-label-caps text-label-caps text-tertiary-fixed mb-1 uppercase">Vía Libre</span><span class="material-symbols-outlined text-tertiary-fixed text-3xl">route</span>`;
        if (c.type === 'empty') inner = `<span class="material-symbols-outlined text-outline-variant text-3xl">block</span>`;
        const border = c.type === 'letter' ? 'border-primary/60 shadow-[0_0_15px_rgba(165,231,255,0.3)]' : (c.type === 'empty' ? 'border-outline-variant' : 'border-secondary/50');
        return `<button disabled class="${base} ${border}">${inner}</button>`;
      }
      return `<button data-i="${i}" class="${base} border-outline-variant group relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
        <span class="font-display-lg text-display-lg-mobile md:text-display-lg text-surface-variant group-hover:text-primary/50 transition-colors font-bold">${i + 1}</span>
      </button>`;
    }).join('');
    $$('[data-i]', $w.grid).forEach(b => b.addEventListener('click', () => openCell(+b.dataset.i)));
  }

  function revealLetterOf(pos) {
    revealedPositions.add(pos);
  }

  function openCell(i) {
    const c = cells[i];
    if (c.discovered || done) return;
    c.discovered = true;
    if (c.type === 'letter') {
      WORD.split('').forEach((l, p) => { if (l === c.letter) revealLetterOf(p); });
      playCorrect();
    } else if (c.type === 'clue') {
      playTick();
    } else if (c.type === 'prize') {
      addPoints('rojo', 5);
      playFinish();
    } else if (c.type === 'bonus') {
      addPoints('azul', 5);
      playFinish();
    } else if (c.type === 'via') {
      // revelar una letra oculta aleatoria
      const hidden = WORD.split('').map((l, p) => p).filter(p => !revealedPositions.has(p));
      if (hidden.length) revealLetterOf(hidden[Math.floor(Math.random() * hidden.length)]);
      playCorrect();
    } else {
      playWrong();
    }
    renderGrid();
    renderWord();
    checkComplete();
  }

  function checkComplete() {
    if (done || revealedPositions.size < WORD.length) return;
    done = true;
    playFinish();
    addPoints('rojo', 10); addPoints('azul', 10); addPoints('verde', 10);
    $w.grid.classList.add('hidden');
    $w.wordDisplay.classList.add('hidden');
    $w.messageWord.textContent = WORD.split('').join(' ');
    $w.message.classList.remove('hidden');
    if (circuit && Array.isArray(circuit.games) && circuit.games.length) {
      $w.next.classList.remove('hidden');
    }
  }

  buildCells();
  renderGrid();
  renderWord();
  $w.next.addEventListener('click', () => window.location.href = nextGameUrl());

  if (circuit) {
    $w.topProgress.textContent = 'JUEGO ' + (gi + 1) + ' / ' + circuit.games.length;
    $w.gameLabel.innerHTML = 'Nivel <span class="text-primary glow-text-primary">' + escapeHtml((cfg && cfg.name) || 'Descubre la Palabra') + '</span>';
  } else {
    $w.topProgress.textContent = 'JUGAR INDIVIDUAL';
    $w.gameLabel.innerHTML = 'Nivel <span class="text-primary glow-text-primary">Descubre la Palabra</span>';
  }
</script>
</body></html>
